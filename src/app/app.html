<!-- ========================
app.html
========================= -->

<app-header />

<main>
    <app-hero />

    <app-video-sample sectionId="videos"
        imageName="jane-doe.jpg" videoId="WYKIPCdAI1U"
        text="Absoluter Experte. Der Schnitt war on-point..."
        author="Kunde / Creator" />

    <app-video-sample videoId="WYKIPCdAI1U"
        imageName="jane-doe.jpg"
        text="Absoluter Experte. Der Schnitt war on-point..."
        author="Kunde / Creator" [reverseDesktop]="true" />

    <!-- Pulls Swiper out of the initial bundle. Rendering on idle rather than on
         viewport keeps the swap away from the moment the section scrolls into
         view, where a placeholder of the wrong height would be visible. -->
    @defer (on idle) {
    <app-thumbnail-gallery />
    } @placeholder {
    <div class="section-placeholder"></div>
    }

    <app-numbers />
    <app-about-me />
    <app-contact />
</main>

<app-footer (openLegal)="openLegal($event)" />

@if (activeLegalView(); as type) {
<div class="drawer-backdrop" (click)="closeLegal()"></div>

<aside class="drawer-panel" role="dialog" data-nosnippet
    aria-modal="true">
    <button class="close-button" type="button"
        aria-label="Schließen" (click)="closeLegal()">
        <svg viewBox="0 0 42 42"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true">
            <circle cx="21" cy="21" r="20" fill="none"
                stroke="currentColor" stroke-width="2" />

            <path d="M15 15L27 27M27 15L15 27" fill="none"
                stroke="currentColor" stroke-width="2"
                stroke-linecap="round" />
        </svg>
    </button>

    <div class="drawer-content">
        @defer (on immediate) {
        @if (type === 'imprint') {
        <app-imprint />
        } @else {
        <app-privacy-policy />
        }
        } @placeholder {
        <div class="drawer-loading">Lade Inhalt...</div>
        }
    </div>
</aside>
}
