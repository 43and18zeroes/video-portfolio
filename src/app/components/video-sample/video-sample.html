<section class="video-section">
  <div class="container">
    <h2>{{ title() }}</h2>

    <div class="grid-container"
      [class.is-reversed]="reverseDesktop()">
      <div class="col-1">
        <app-youtube-embed [videoId]="videoId()" />
      </div>

      <div class="col-2">
        <app-testimonial [text]="text()"
          [author]="author()" />
      </div>
    </div>
  </div>
</section>
