<!-- ========================
custom-select.html
========================= -->

<div class="custom-select" [class.is-open]="isOpen()"
    [class.invalid]="invalid()">

    <button #trigger type="button" class="select-trigger"
        (click)="toggle()" (keydown)="onTriggerKeydown($event)"
        aria-haspopup="listbox"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-labelledby]="ariaLabelledBy()"
        [disabled]="disabled()">
        <span [class.placeholder]="!selectedLabel()">
            {{ selectedLabel() || placeholder() }}
        </span>
        <svg class="arrow-icon" viewBox="0 0 24 24"
            fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="m6 9 6 6 6-6" />
        </svg>
    </button>

    @if (isOpen()) {
    <ul class="select-menu" role="listbox"
        [attr.aria-labelledby]="ariaLabelledBy()"
        (keydown)="onMenuKeydown($event)">
        @for (option of options(); track option.value; let i = $index) {
        <li #option class="select-option" role="option" tabindex="-1"
            [attr.aria-selected]="value() === option.value"
            [class.selected]="value() === option.value"
            [class.is-active]="activeIndex() === i"
            (click)="select(option)">
            {{ option.label }}
        </li>
        }
    </ul>
    }
</div>
