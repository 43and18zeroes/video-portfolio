<!-- ========================
video-sample.html
========================= -->

<section [attr.id]="sectionId()" class="video-section">
  <div class="container">
    @if (heading()) {
      <h2>{{ heading() }}</h2>
    }

    <div class="grid-container" [class.is-reversed]="reverseDesktop()">
      <div class="col-1">
        <app-testimonial [text]="text()" [author]="author()" [imageName]="imageName()" />
      </div>

      <div class="col-2">
        <app-youtube-embed [videoId]="videoId()" />
      </div>
    </div>
  </div>
</section>
