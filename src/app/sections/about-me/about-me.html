<!-- ========================
about-me.html
========================= -->

<section id="about-me" class="about-me-section" aria-labelledby="about-me-heading">
  <div class="container">
    <div class="grid-container">
      <div class="col-image">
        <img
          src="img/avatar-720.jpg"
          [alt]="t().about.portraitAlt"
          loading="lazy"
          decoding="async"
          width="720"
          height="720"
        />
      </div>

      <div class="col-text">
        <h2 id="about-me-heading">{{ t().about.heading }}</h2>

        <p class="lead">{{ t().about.lead }}</p>

        <p class="grey-text">{{ t().about.body }}</p>
      </div>
    </div>

    <app-technologies />
  </div>
</section>
