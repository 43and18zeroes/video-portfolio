<!-- ========================
thumbnail-gallery.html
========================= -->

<section id="thumbnails" class="thumbnail-section"
  aria-labelledby="thumbnails-heading">
  <div class="container">

    <div class="section-header">
      <span class="badge-accent">Photoshop &amp;
        Design</span>
      <h2 id="thumbnails-heading">Thumbnails, die Klicks
        bringen</h2>
      <p>Perfektes Compositing und zielgerichtete Typografie
        für maximale CTR.</p>
    </div>

    <swiper-container #swiper class="thumbnail-swiper"
      init="false" effect="coverflow" grab-cursor="true"
      centered-slides="true" slides-per-view="auto"
      loop="true" loop-prevents-sliding="false"
      loop-additional-slides="2" speed="450" threshold="2"
      short-swipes="true" long-swipes-ms="600"
      long-swipes-ratio="0.3" coverflow-effect-rotate="16"
      coverflow-effect-stretch="0"
      coverflow-effect-depth="360"
      coverflow-effect-modifier="1"
      coverflow-effect-slide-shadows="false"
      navigation="true" pagination="true"
      pagination-clickable="true" keyboard-enabled="true"
      autoplay-delay="4200"
      autoplay-disable-on-interaction="false"
      autoplay-pause-on-mouse-enter="true">

      @for (slide of slides; track slide.id) {
      <swiper-slide>
        <div class="thumbnail-card">
          <img [src]="slide.src" [alt]="slide.title"
            width="960" height="540" loading="lazy"
            decoding="async">
          <div class="card-caption">
            <span class="ctr-badge">{{ slide.ctr }}</span>
          </div>
        </div>
      </swiper-slide>
      }

    </swiper-container>

  </div>
</section>
