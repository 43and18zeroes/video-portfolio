<!-- ========================
thumbnail-gallery.html
========================= -->

<section id="thumbnails" class="thumbnail-section">
  <div class="container">
    
    <div class="section-header">
      <span class="badge-accent">Photoshop & Design</span>
      <h2>Thumbnails, die Klicks bringen</h2>
      <p>Perfektes Compositing und zielgerichtete Typografie für maximale CTR.</p>
    </div>

    <swiper-container 
      effect="coverflow" 
      grab-cursor="true" 
      centered-slides="true" 
      slides-per-view="auto"
      loop="true"
      coverflow-effect-rotate="20"
      coverflow-effect-depth="180"
      coverflow-effect-modifier="1"
      coverflow-effect-slide-shadows="false">
      
      <swiper-slide *ngFor="let thumb of thumbnails">
        <div class="thumbnail-card">
          <img [src]="thumb.src" [alt]="thumb.title" loading="lazy">
          <span class="ctr-badge">{{ thumb.ctr }}</span>
        </div>
      </swiper-slide>

    </swiper-container>

  </div>
</section>
