<!-- ========================
index.html
========================= -->

<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>CMW Media</title>
    <!-- German default for crawlers that do not run scripts. I18nService
       rewrites it via Meta when English is active. -->
    <meta
      name="description"
      content="CMW Media – Videoschnitt und Thumbnail-Design für YouTube, Shortform und Social Media. Schnitt, Motion Design und Thumbnails aus einer Hand."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A @font-face rule alone starts no download: the browser fetches a webfont
         only once rendered content needs it, which in this SPA is after main.js has
         run. These two move the request to HTML parse time so the faces are there
         before the first text is painted. crossorigin is required even same-origin,
         otherwise the preload is fetched in a different mode than the CSS request
         and the file is downloaded twice. -->
    <link
      rel="preload"
      href="/fonts/Inter-VariableFont_opsz,wght.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Sora-VariableFont_wght.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico" />
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="manifest" href="favicon/site.webmanifest" />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
